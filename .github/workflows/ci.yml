name: CI

on:
  push:
  workflow_dispatch:

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      # 版本从根 package.json 的 packageManager: pnpm@12.16.1 读取
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm --filter @coastlinecreations/schematic-renderer run lint

      - name: Build
        run: pnpm -r run build
