<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>方块工坊 SDK · 最小示例</title>
  <style>
    *{box-sizing:border-box} body{margin:0;background:#edf0e8;color:#26331f;font:14px system-ui,sans-serif}
    header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:16px 24px;background:#fff;border-bottom:1px solid #d9dfd2}
    h1{font-size:18px;margin:0 auto 0 0}button,a{color:inherit} button{padding:8px 14px;border:1px solid #bac6ac;border-radius:8px;background:#f4f7ef;cursor:pointer}
    main{display:grid;grid-template-columns:1fr 290px;height:calc(100vh - 78px)}canvas{display:block;width:100%;height:100%;min-width:0}
    aside{overflow:auto;padding:20px;background:#fff;border-left:1px solid #d9dfd2}#status{white-space:pre-wrap;line-height:1.6}li{margin:8px 0}
    @media(max-width:700px){main{grid-template-columns:1fr;height:auto}canvas{height:60vh}aside{border-top:1px solid #d9dfd2}}
  </style>
</head>
<body>
<header><h1>方块工坊 · SDK 最小接入</h1><a href="./index.html">完整示例</a><input id="file" type="file" accept=".litematic,.schem,.schematic,.nbt" hidden><button id="open" disabled>打开蓝图</button><button id="fit" disabled>适应窗口</button><button id="mode" disabled>切换正交</button><button id="export" disabled>导出材料</button></header>
<main><canvas id="canvas"></canvas><aside><h2>材料清单</h2><p id="status">正在初始化…</p><ol id="materials"></ol></aside></main>
<script type="module" src="./src/minimal.js"></script>
</body>
</html>
